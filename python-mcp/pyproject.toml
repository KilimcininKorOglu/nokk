# nokk-mcp — `uvx nokk-mcp` runs nokk as an MCP server.
#
# The server itself lives in the `nokk` package (`nokk.mcp`); this package only
# gives it a command of its own and pulls in the MCP SDK. The `nokk` wheel cannot
# carry that command: its script slot is the embedded `nokk` binary.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nokk-mcp"
# Same version as `nokk`; CI sets both from the tag.
version = "0.1.45a1"
description = "MCP server for nokk, a Chrome-fingerprinted headless browser engine that passes Cloudflare: give an AI agent a browser with `uvx nokk-mcp`."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "koloss777" }]
keywords = ["mcp", "model-context-protocol", "headless-browser", "web-scraping", "cloudflare", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = ["nokk>=0.1.45a1", "mcp>=1.2", "websockets>=12"]

[project.scripts]
nokk-mcp = "nokk_mcp:main"

[project.urls]
Homepage = "https://github.com/koloss777/nokk"
Repository = "https://github.com/koloss777/nokk"
Issues = "https://github.com/koloss777/nokk/issues"

[tool.hatch.build.targets.wheel]
packages = ["nokk_mcp"]
