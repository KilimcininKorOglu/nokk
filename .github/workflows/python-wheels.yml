name: python-wheels

# Build and publish the `nokk` PyPI launcher wheel — a wheel that *embeds* the
# prebuilt `nokk` binary, so `pip install nokk` needs no Rust toolchain, no
# BoringSSL build, and no Docker on the user's machine.
#
# Built in the same Debian bullseye image as the release binary
# (.github/bullseye-build.Dockerfile); maturin auditwheel-repairs the wheel to a
# manylinux_2_31 tag, which covers RHEL/Alma 9, Ubuntu 20.04+ and Debian 11+.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the tag: v0.1.20-alpha -> 0.1.20a1 (PEP 440). Done on the
      # host; the container builds against the edited python/pyproject.toml.
      - name: Sync wheel version from the tag
        if: github.ref_type == 'tag'
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          PEP="${RAW/-alpha/a1}"; PEP="${PEP/-beta/b1}"; PEP="${PEP/-rc./rc}"
          echo "wheel version: $PEP"
          sed -i "s/^version = \".*\"/version = \"$PEP\"/" python/pyproject.toml

      # Build in Debian 11 (bullseye, glibc 2.31) so the embedded binary runs on a
      # broad range of Linux (RHEL/Alma 9, Ubuntu 20.04+, Debian 11+) — matching the
      # release binary. maturin auditwheel-repairs to a manylinux_2_31 tag. A
      # `docker build` of .github/bullseye-build.Dockerfile, not a `docker run`: apt
      # cannot take its locks inside a plain container under the runner's docker.
      # The context carries the pyproject.toml edited above.
      - name: Build wheel (Debian bullseye — broad glibc floor ~2.30)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target wheel-out \
            --output type=local,dest=python/dist .

      - name: Sanity-check the wheel embeds the binary
        run: |
          python3 - <<'PY'
          import glob, zipfile
          whl = glob.glob("python/dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith(".data/scripts/nokk") for n in names), \
              f"binary not embedded in wheel: {names}"
          print("ok:", whl)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC) — configure the publisher on the PyPI
      # project first (owner koloss777, repo nokk, workflow python-wheels.yml,
      # environment pypi); no API token secret needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
