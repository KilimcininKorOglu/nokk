name: ports

# Linux ARM64 and macOS Apple Silicon: build, test, smoke-run, keep the binary as an
# artifact for testing on real hardware. Manual (or on a change to this file) until
# both are steadily green;
# releases do not use it yet.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ports.yml]

jobs:
  linux-arm64:
    name: linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The same bullseye image as the x86_64 release, so the glibc floor matches.
      - name: Build (Debian bullseye)
        run: |
          docker build -f .github/bullseye-build.Dockerfile --target bin-out \
            --output type=local,dest=out .
          tar -czf nokk-linux-aarch64.tar.gz -C out nokk

      - uses: actions/upload-artifact@v4
        with:
          name: nokk-linux-aarch64
          path: nokk-linux-aarch64.tar.gz

      - name: Smoke
        run: |
          ./out/nokk --version
          ./out/nokk --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5), new Intl.PluralRules('ru').select(2)].join(' | ')"

      # Datacenter addresses get a harder time from Cloudflare: informative only.
      - name: Public Cloudflare pages
        continue-on-error: true
        run: NOKK=./out/nokk tools/cf-check.sh

  linux-arm64-test:
    name: linux arm64 tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config cmake
      - name: Test
        run: |
          export LIBCLANG_PATH="$(dirname "$(find /usr/lib -name 'libclang.so*' | head -1)")"
          cargo test --release --workspace

  macos-arm64:
    name: macos apple silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          [ -f "$LIBCLANG_PATH/libclang.dylib" ] || export LIBCLANG_PATH=/Library/Developer/CommandLineTools/usr/lib
          cargo build --release --bin nokk
          tar -czf nokk-macos-aarch64.tar.gz -C target/release nokk

      - uses: actions/upload-artifact@v4
        with:
          name: nokk-macos-aarch64
          path: nokk-macos-aarch64.tar.gz

      - name: Test
        run: |
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          [ -f "$LIBCLANG_PATH/libclang.dylib" ] || export LIBCLANG_PATH=/Library/Developer/CommandLineTools/usr/lib
          cargo test --release --workspace

      - name: Smoke
        run: |
          ./target/release/nokk --version
          ./target/release/nokk --eval "[navigator.webdriver, navigator.platform, new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(1234.5), new Intl.PluralRules('ru').select(2)].join(' | ')"

      - name: Public Cloudflare pages
        continue-on-error: true
        run: |
          brew install coreutils >/dev/null   # cf-check.sh uses GNU timeout
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          NOKK=./target/release/nokk tools/cf-check.sh
