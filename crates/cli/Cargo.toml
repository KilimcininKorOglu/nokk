[package]
name = "nokk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line interface and CDP server binary for the nokk headless browser engine."
repository.workspace = true
keywords = ["headless-browser", "stealth", "scraping", "cli", "puppeteer"]
categories = ["command-line-utilities", "web-programming"]

[features]
# Real pixels are on by default: a synthesized canvas is a fingerprint of its
# own — it draws nothing a font engine would draw, and it carries per-session
# noise, which is itself what anti-bot scoring looks for. `cargo build
# --no-default-features` gives the light build back (docs/rendering.md).
default = ["render", "webgl"]
# Real off-screen canvas rasterization: tiny-skia + ab_glyph, pure Rust.
render = ["nokk/render"]
# Real headless WebGL. Loads libEGL at run time and falls back to the drawn
# surface where Mesa/EGL is absent, so it is safe to build in everywhere.
webgl = ["nokk/webgl"]

[[bin]]
name = "nokk"
path = "src/main.rs"

[dependencies]
nokk = { workspace = true }
nokk-net = { workspace = true }
nokk-stealth = { workspace = true }
nokk-cdp = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
