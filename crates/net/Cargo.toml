[package]
name = "nokk-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Chrome-fingerprinted HTTP client (BoringSSL JA3/JA4 + HTTP/2) for the nokk headless browser engine."
repository.workspace = true
keywords = ["ja3", "ja4", "tls-fingerprint", "http-client", "anti-bot"]
categories = ["network-programming", "web-programming"]

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Chrome-fingerprinted HTTP client (Phase 2): BoringSSL-backed Chrome ClientHello
# + HTTP/2 fingerprint. Build needs cmake + libclang (see docs/BUILD.md).
wreq = { workspace = true }
wreq-util = { workspace = true }

# Persistent, serializable cookie jar for named sessions (warm up once, resume
# later). `cookie_store` is already in the tree via wreq; pin the same version so
# there is a single `cookie` crate in the graph and `RawCookie` types match.
cookie_store = "0.21"
url = "2"

# Распаковка тела своими руками. Без неё клиент распаковывает сам и стирает
# `content-length` с `content-encoding`, а вместе с ними — размер, который
# ушёл по проводу. Браузер его знает и показывает страницам
# (`transferSize`, `encodedBodySize`), и сторона, отдавшая файл, знает тоже:
# несовпадение там видно сразу. Версии — те же, что уже в дереве через wreq.
brotli = "8"
flate2 = "1"
zstd = "0.13"
